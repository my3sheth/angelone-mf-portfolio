<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Angel One Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/styles.css?v=2" />
    <style>
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px 16px;
      }
      .auth-card {
        width: min(540px, 100%);
        background: linear-gradient(180deg, rgba(17, 28, 42, 0.94), rgba(11, 18, 29, 0.96));
        border: 1px solid rgba(152, 176, 206, 0.18);
        border-radius: 28px;
        box-shadow: 0 24px 52px rgba(3, 6, 12, 0.42);
        padding: 32px;
      }
      .auth-header {
        margin-bottom: 24px;
      }
      .auth-form {
        display: grid;
        gap: 16px;
      }
      .sessions-section {
        margin-bottom: 24px;
        display: none;
      }
      .section-title {
        font-size: 0.82rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 12px;
      }
      .accounts-list {
        display: grid;
        gap: 10px;
        margin-bottom: 16px;
      }
      .account-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px;
        border-radius: 16px;
        background: rgba(10, 18, 28, 0.7);
        border: 1px solid rgba(152, 176, 206, 0.14);
        transition: all 0.2s ease;
      }
      .account-card:hover {
        border-color: rgba(240, 173, 92, 0.35);
        background: rgba(15, 26, 40, 0.85);
      }
      .account-info {
        display: grid;
        gap: 3px;
      }
      .account-name {
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--text);
      }
      .account-meta {
        font-size: 0.78rem;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .badge {
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: 8px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .badge.active {
        background: rgba(143, 227, 168, 0.15);
        color: var(--success);
        border: 1px solid rgba(143, 227, 168, 0.3);
      }
      .badge.expired {
        background: rgba(255, 180, 162, 0.15);
        color: #ffb4a2;
        border: 1px solid rgba(255, 180, 162, 0.3);
      }
      .account-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn-sm {
        padding: 7px 14px;
        font-size: 0.82rem;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
      }
      .btn-del {
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 6px;
        font-size: 1rem;
        border-radius: 8px;
        transition: color 0.2s;
      }
      .btn-del:hover {
        color: #ff8888;
        background: rgba(255, 80, 80, 0.1);
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 20px 0;
        color: var(--muted);
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .divider::before, .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(152, 176, 206, 0.14);
      }
      .status {
        min-height: 20px;
        color: var(--accent-2);
        font-size: 0.9rem;
        text-align: center;
      }
      .status.error { color: #ffb4a2; }
      .status.success { color: var(--success); }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <div class="auth-header">
        <h1>AngelOne Mutual Funds Portfolio</h1>
        <p class="subtle" style="margin: 6px 0 0;">Manage and view your mutual funds portfolios with live holdings analytics.</p>
      </div>

      <div id="sessionsSection" class="sessions-section">
        <div class="section-title">Saved Accounts</div>
        <div id="accountsList" class="accounts-list"></div>
        <div class="divider">or connect new account</div>
      </div>

      <form id="loginForm" class="auth-form">
        <button class="primary" id="loginBtn" type="submit" style="width: 100%; padding: 14px; font-size: 1rem; font-weight: 700;">
          Log in to AngelOne
        </button>
        <div id="status" class="status" aria-live="polite"></div>
      </form>
    </div>

    <script src="/static/login.js?v=5"></script>
  </body>
</html>
