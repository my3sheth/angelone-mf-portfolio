<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14243b"/>
      <stop offset="50%" stop-color="#0b1320"/>
      <stop offset="100%" stop-color="#060a12"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0ad5c"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#8fe3a8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(240, 173, 92, 0.6)"/>
      <stop offset="100%" stop-color="rgba(125, 211, 252, 0.3)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Growth chart bars / geometric logo -->
  <g filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="28" y="72" width="14" height="28" rx="5" fill="#f0ad5c" opacity="0.85"/>
    
    <!-- Bar 2 -->
    <rect x="48" y="54" width="14" height="46" rx="5" fill="#7dd3fc" opacity="0.9"/>
    
    <!-- Bar 3 -->
    <rect x="68" y="38" width="14" height="62" rx="5" fill="url(#accentGrad)"/>
    
    <!-- Bar 4 (Peak) -->
    <rect x="88" y="24" width="14" height="76" rx="5" fill="#8fe3a8"/>

    <!-- Upward trend sparkline -->
    <path d="M 26 76 Q 48 50 68 40 T 96 22" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <!-- Peak dot -->
    <circle cx="96" cy="22" r="5" fill="#ffffff"/>
  </g>
</svg>
